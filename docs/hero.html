<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Compresso hero</title>
<!--
  Source for docs/hero-light.png and docs/hero-dark.png, the README banner.

  Every value below is copied from compresso-web/app/globals.css. If the two
  ever disagree, that file wins: this is a mirror, not a second design system.

  Capture (1280x640 at 2x, from the repo root):

    BRAVE="/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"
    "$BRAVE" --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1280,640 \
      --screenshot=docs/hero-light.png "file://$PWD/docs/hero.html?theme=light"
    "$BRAVE" --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1280,640 \
      --screenshot=docs/hero-dark.png "file://$PWD/docs/hero.html?theme=dark"

  The platform chip uses U+F8FF, the Apple glyph, which resolves from the
  system font on macOS only. Capture on a Mac or it renders as a blank box.
-->
<style>
  :root {
    --cream: #F8F6EF; --canvas: #FBFAF5; --card: #FFFEF9;
    --line: #DFE3DF; --line-hover: #9EAEA4;
    --ink: #26352E; --ink-2: #607068; --ink-3: #78847D;
    --pine: #183D30; --on-pine: #F8F6EF; --pine-detail: #C9D8CF;
    --logo: var(--pine);
    --claude: #C47A42; --claude-sent: #B86D36;
    --codex: #567CA8; --codex-sent: #4F739B;
    --chip-line: #DCE2DD; --link: #557064;
    --elev-card: 0 6px 18px rgba(40, 58, 49, .07);
    --radius-card: 12px; --radius-control: 8px; --radius-pill: 999px;
    --font-serif: "Iowan Old Style", Baskerville, Georgia, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  :root[data-theme="dark"] {
    --cream: #131A16; --canvas: #131A16; --card: #1A221C;
    --line: #2A352D; --line-hover: #3D4A40;
    --ink: #E8ECE7; --ink-2: #A7B3AA; --ink-3: #7D8A80;
    --pine: #1F4A39; --on-pine: #F8F6EF; --logo: #F8F6EF;
    --claude-sent: #CD8148; --codex-sent: #6B93C8;
    --chip-line: #2A352D; --link: #8FB3A0;
    --elev-card: 0 6px 18px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: var(--cream); color: var(--ink);
    font-family: var(--font-sans); font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* Centred pair rather than a 1fr/auto grid: the copy is capped at ~32ch, so
     a stretching first column just opened a dead gulf in the middle of the
     canvas. Both blocks size to their content and the leftover becomes equal
     outer margin. */
  .hero {
    width: 100%; height: 100%; padding: 0 34px;
    display: flex; align-items: center; justify-content: center; gap: 78px;
  }
  .copy { max-width: 700px; }

  /* ── Left: brand, headline, platform ─────────────────────────────────── */
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .mark { width: 34px; height: 34px; color: var(--logo); display: block; }
  .brand .word { font-size: 1.85rem; font-weight: 700; letter-spacing: -.02em; }

  h1 {
    font-family: var(--font-serif); font-weight: 400;
    font-size: 6rem; line-height: .98; letter-spacing: -.05em;
    margin: 34px 0 0;
  }
  .lede {
    font-size: 1.4rem; line-height: 1.5; color: var(--ink-2);
    max-width: 35ch; margin: 28px 0 0;
  }

  .meta { display: flex; align-items: baseline; gap: 24px; margin-top: 40px; }
  .url {
    font-family: var(--font-mono); font-size: 1rem; color: var(--link);
    letter-spacing: -.01em;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    border: 1px solid var(--chip-line); border-radius: var(--radius-pill);
    padding: 10px 19px; background: var(--card);
    font-family: var(--font-mono); font-size: .85rem;
    letter-spacing: .05em; color: var(--ink-2);
  }
  /* U+F8FF. Kept in its own span so the fallback stack is stated once, and so
     a missing glyph is obvious in review rather than silently blank. */
  .chip .apple { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 1.06rem; line-height: 1; }

  /* ── Right: the flow, mirroring components/hero-flow.tsx ─────────────── */
  .vflow {
    width: 462px; padding: 36px 32px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-card); box-shadow: var(--elev-card);
    display: flex; flex-direction: column; align-items: center;
  }
  .vflow .node {
    border: 1px solid var(--line); border-radius: var(--radius-control);
    padding: 14px 18px; background: var(--canvas); text-align: center;
  }
  .vflow .n-title { font-size: 1.02rem; font-weight: 650; }
  .vflow .n-sub { font-family: var(--font-mono); font-size: .82rem; color: var(--ink-3); margin-top: 4px; }
  .vflow .node-pine {
    background: var(--pine); border-color: var(--pine);
    display: flex; align-items: center; justify-content: center; gap: 12px; text-align: left;
  }
  .vflow .node-pine .mark { width: 24px; height: 24px; flex: none; color: var(--on-pine); display: block; }
  .vflow .node-pine .n-title { color: var(--on-pine); }
  .vflow .node-pine .n-sub { color: var(--pine-detail); }
  .vflow .agents { display: flex; flex-direction: column; gap: 10px; align-self: stretch; }
  .vflow .agent {
    display: flex; align-items: center; gap: 11px;
    border: 1px solid var(--line); border-left-width: 4px;
    border-radius: var(--radius-control); padding: 11px 16px;
    background: var(--canvas); font-size: 1.02rem; font-weight: 650;
  }
  .vflow .agent.claude { border-left-color: var(--claude); }
  .vflow .agent.codex { border-left-color: var(--codex); }
  .vflow .agent .mark { width: 18px; height: 18px; flex: none; display: block; }

  .vlane { position: relative; height: 100px; align-self: stretch; }
  .vwire { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .vwire::after {
    content: ""; position: absolute; left: -3px; top: -1px;
    border: 3.5px solid transparent; border-bottom-color: var(--line-hover);
  }
  .vwire.w-claude { left: calc(50% - 18px); }
  .vwire.w-codex { left: calc(50% + 18px); }
  .vlabel {
    position: absolute; left: calc(50% + 33px); top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: .76rem; color: var(--ink-3); letter-spacing: .05em;
  }

  /* The animation's packets, frozen. On the live site a request rides up the
     raw lane and continues as a shorter, fully saturated bar; here the two
     lanes simply show both states at once, which is the whole idea in one
     frame. Heights below are hand-picked from the live run's range (16-40px
     raw) and its 0.42 compression ratio, so the drawing does not overstate
     what the animation shows. */
  .vbar { position: absolute; left: -4.5px; width: 10px; border-radius: 5px; }
  .raw .w-claude .vbar { height: 45px; background: var(--claude-sent); opacity: .45; top: 30px; }
  .raw .w-codex  .vbar { height: 36px; background: var(--codex-sent);  opacity: .45; top: 50px; }
  .out .w-claude .vbar {
    height: 19px; background: var(--claude-sent); opacity: 1; top: 34px;
    box-shadow: 0 0 8px var(--claude-sent);
  }
  .out .w-codex .vbar {
    height: 16px; background: var(--codex-sent); opacity: 1; top: 57px;
    box-shadow: 0 0 8px var(--codex-sent);
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="copy">
      <div class="brand">
        <svg class="mark" viewBox="0 0 364 357" fill="currentColor" aria-hidden="true">
          <path d="M276 0H88V88H276V0Z"/>
          <path d="M0 88H88V269H276V88H364V181L188 357H0V88Z"/>
        </svg>
        <span class="word">Compresso</span>
      </div>

      <h1>Same answers.<br>Fewer tokens.</h1>

      <p class="lede">
        A local compression layer for Claude&nbsp;Code and Codex. It shrinks what
        your agent reads before the request is billed.
      </p>

      <div class="meta">
        <div class="chip"><span class="apple">&#xF8FF;</span> macOS 14+ &middot; Apple Silicon</div>
        <span class="url">compresso.ai</span>
      </div>
    </div>

    <aside class="vflow">
      <div class="node">
        <div class="n-title">Anthropic &middot; OpenAI</div>
        <div class="n-sub">your account</div>
      </div>

      <div class="vlane out">
        <span class="vwire w-claude"><i class="vbar"></i></span>
        <span class="vwire w-codex"><i class="vbar"></i></span>
        <span class="vlabel">compressed</span>
      </div>

      <div class="node node-pine">
        <svg class="mark" viewBox="0 0 364 357" fill="currentColor" aria-hidden="true">
          <path d="M276 0H88V88H276V0Z"/>
          <path d="M0 88H88V269H276V88H364V181L188 357H0V88Z"/>
        </svg>
        <div>
          <div class="n-title">Compresso</div>
          <div class="n-sub">on your Mac</div>
        </div>
      </div>

      <div class="vlane raw">
        <span class="vwire w-claude"><i class="vbar"></i></span>
        <span class="vwire w-codex"><i class="vbar"></i></span>
        <span class="vlabel">raw context</span>
      </div>

      <div class="agents">
        <div class="agent claude">

          </svg>
          Claude Code
        </div>

          </svg>
          Codex
        </div>
      </div>
    </aside>
  </div>

<script>
  // ?theme=dark flips the palette, so one source file produces both captures.
  // Anything other than "dark" leaves the light default in place.
  var t = new URLSearchParams(location.search).get("theme");
  if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
</script>
</body>
</html>
